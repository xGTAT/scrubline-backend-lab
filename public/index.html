<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantage Commerce - Dashboard</title>
<link rel="stylesheet" href="/css/main.css">
</head><body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo">Vantage</div>
    <a href="/" class="active">Dashboard</a>
    <a href="/items">Items</a>
    <a href="/analytics">Analytics</a>
  </nav>
  <main class="main">
    <div class="header">
      <h1>Dashboard</h1>
      <div class="header-actions">
        <button class="btn" onclick="location.href='/items'">View Items</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="chart-placeholder" id="trendChart">Loading trend data...</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th></tr></thead>
        <tbody id="recentItems"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
</body></html>
