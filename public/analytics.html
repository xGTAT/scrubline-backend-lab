<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantage Commerce - Analytics</title>
<link rel="stylesheet" href="/css/main.css">
</head><body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo">Vantage</div>
    <a href="/">Dashboard</a>
    <a href="/items">Items</a>
    <a href="/analytics" class="active">Analytics</a>
  </nav>
  <main class="main">
    <div class="header">
      <h1>Analytics</h1>
      <div class="header-actions">
        <select id="periodSelect" onchange="loadTrends()">
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="90d">Last 90 days</option>
        </select>
      </div>
    </div>
    <div class="stats" id="analyticsStats"></div>
    <div class="chart-placeholder" id="trendChart">Loading trend data...</div>
    <div class="chart-placeholder" id="breakdownChart">Loading category breakdown...</div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/analytics.js"></script>
</body></html>
